<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/IMAGENS/favicon.png" type="image/png" />
  <title>Pedidos | Mestre Maro</title>
  <link rel="stylesheet" href="/CSS/pedidos.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a href="/index.html" class="brand">
      <img src="/IMAGENS/logo mestre maro.png" alt="Mestre Maro" class="brand-logo" />
    </a>
    <div class="header-title">
      <span class="header-tag">Cardápio</span>
      <h1>Faça seu Pedido</h1>
    </div>
    <button class="cart-toggle" id="cartToggle" aria-label="Ver carrinho">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </header>

  <main class="main">

    <!-- BUSCA E FILTROS -->
    <section class="filters-bar">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar produto..." autocomplete="off" />
      </div>
      <div class="group-filters" id="groupFilters">
        <button class="filter-btn active" data-group="all">Todos</button>
      </div>
    </section>

    <!-- LAYOUT PRINCIPAL -->
    <div class="layout">

      <!-- LISTA DE PRODUTOS -->
      <section class="products-section">

        <!-- skeleton (mostrado enquanto carrega) -->
        <div class="products-grid" id="skeletonGrid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>

        <!-- grid real (oculto até carregar) -->
        <div class="products-grid" id="productsGrid" style="display:none;"></div>

        <!-- estado vazio -->
        <div class="empty-state" id="emptyState" style="display:none;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <p>Nenhum produto encontrado</p>
        </div>

      </section>

      <!-- CARRINHO -->
      <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
          <h2>Carrinho</h2>
          <span class="cart-count" id="cartCount">0 itens</span>
        </div>

        <div class="cart-items" id="cartItems">
          <div class="cart-empty" id="cartEmpty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <p>Seu carrinho está vazio</p>
          </div>
        </div>

        <div class="cart-footer" id="cartFooter" style="display:none;">
          <div class="subtotal-row">
            <span>Subtotal</span>
            <strong id="subtotalValue">R$ 0,00</strong>
          </div>
          <div class="total-row">
            <span>Total</span>
            <strong id="totalValue">R$ 0,00</strong>
          </div>
          <button class="btn-checkout" id="btnCheckout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Fazer Pedido
          </button>
        </div>
      </aside>

    </div>
  </main>

  <!-- OVERLAY MOBILE -->
  <div class="cart-overlay" id="cartOverlay"></div>

  <!-- MODAL DE CONFIRMAÇÃO -->
  <div class="modal-backdrop" id="modalBackdrop" style="display:none;">
    <div class="modal" id="confirmModal">
      <div class="modal-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h3>Confirmar Pedido?</h3>
      <p>Revise os itens antes de finalizar.</p>
      <div class="modal-items" id="modalItems"></div>
      <div class="modal-total">
        <span>Total</span>
        <strong id="modalTotal">R$ 0,00</strong>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">Cancelar</button>
        <button class="btn-confirm" id="btnConfirm">Confirmar Pedido</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-storage-compat.js"></script>
    <script src="/JS/firebase-init.js"></script>
    <script src="/JS/authGuard.js"></script>
  <script src="/JS/pedidos.js"></script>
</body>
</html>
